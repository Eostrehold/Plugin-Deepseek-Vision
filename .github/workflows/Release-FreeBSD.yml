name: Release FreeBSD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04

    outputs:
      value: ${{ steps.version.outputs.value }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$RELEASE_INPUT"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package freebsd/amd64
    needs: version
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Start FreeBSD
      # ============================================================

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: "15.1"
          shell: bash
          memory: 6G
          cpu_count: 4

      # ============================================================
      # Install system dependencies
      # ============================================================

      - name: Install FreeBSD dependencies
        shell: cpa.sh {0}
        run: |
          set -euo pipefail

          sudo pkg update

          sudo pkg install -y \
            ca_root_nss \
            curl \
            git \
            python3 \
            unzip

          echo
          echo "========== Dependencies =========="

          echo "--- Python ---"
          python3 --version

          echo "--- Git ---"
          git --version

          echo "--- curl ---"
          curl --version | head -n 1

          echo "--- clang ---"
          clang --version | head -n 1

          echo "--- nm ---"
          nm --version || true

          echo "=================================="
          echo

      # ============================================================
      # Install Go
      # ============================================================

      - name: Install Go 1.26.4
        shell: cpa.sh {0}
        run: |
          set -euo pipefail

          GO_VERSION="1.26.4"
          GO_ARCHIVE="go${GO_VERSION}.freebsd-amd64.tar.gz"

          # SHA256 from the official Go download page.
          GO_SHA256="e91e96c0d3bd8f770e5a0facaf21d010a84e1c9440d830210cb3c223f0b7fb50"

          echo "Downloading ${GO_ARCHIVE}..."

          curl -fL \
            "https://go.dev/dl/${GO_ARCHIVE}" \
            -o "/tmp/${GO_ARCHIVE}"

          echo "Verifying Go archive..."

          echo "${GO_SHA256}  /tmp/${GO_ARCHIVE}" \
            | sha256 -c -

          echo "Installing Go ${GO_VERSION}..."

          sudo rm -rf /usr/local/go

          sudo tar \
            -C /usr/local \
            -xzf "/tmp/${GO_ARCHIVE}"

          export PATH="/usr/local/go/bin:${PATH}"

          echo
          echo "========== Go =========="

          go version

          echo
          echo "GOOS=$(go env GOOS)"
          echo "GOARCH=$(go env GOARCH)"

          echo "========================"

          test "$(go env GOOS)" = "freebsd"
          test "$(go env GOARCH)" = "amd64"

      # ============================================================
      # Verify native environment
      # ============================================================

      - name: Verify native FreeBSD environment
        shell: cpa.sh {0}
        run: |
          set -euo pipefail

          export PATH="/usr/local/go/bin:${PATH}"

          echo "========================================"
          echo "Native FreeBSD Build Environment"
          echo "========================================"

          echo
          echo "Operating system:"
          uname -a

          echo
          echo "Kernel:"
          uname -sr

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "Go:"
          go version

          echo
          echo "Go environment:"
          go env GOOS
          go env GOARCH
          go env CGO_ENABLED

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Git:"
          git --version

          echo
          echo "Compiler:"
          clang --version | head -n 1

          echo
          echo "NM:"
          nm --version || true

          echo
          echo "========================================"
          echo "Validation"
          echo "========================================"

          test "$(uname -s)" = "FreeBSD"
          test "$(uname -m)" = "amd64"

          test "$(go env GOOS)" = "freebsd"
          test "$(go env GOARCH)" = "amd64"

          test "$(go env CGO_ENABLED)" = "1"

          command -v go
          command -v python3
          command -v git
          command -v clang
          command -v nm

          echo
          echo "FreeBSD environment is ready."

      # ============================================================
      # Build
      # ============================================================

      - name: Build FreeBSD release
        shell: cpa.sh {0} --environment-variables VERSION TARGET_GOOS TARGET_GOARCH DIST_DIR GO_VERSION
        env:
          VERSION: ${{ needs.version.outputs.value }}
          TARGET_GOOS: freebsd
          TARGET_GOARCH: amd64
          DIST_DIR: dist
          GO_VERSION: "1.26.4"
        run: |
          set -euo pipefail

          export PATH="/usr/local/go/bin:${PATH}"

          echo "========================================"
          echo "Building FreeBSD release"
          echo "========================================"

          echo
          echo "VERSION=${VERSION}"
          echo "TARGET_GOOS=${TARGET_GOOS}"
          echo "TARGET_GOARCH=${TARGET_GOARCH}"
          echo "DIST_DIR=${DIST_DIR}"
          echo "GO_VERSION=${GO_VERSION}"

          echo
          echo "Go:"
          go version

          echo
          echo "Native target:"
          echo "GOOS=$(go env GOOS)"
          echo "GOARCH=$(go env GOARCH)"

          echo
          echo "Running:"
          echo "./scripts/ci-package.sh"

          ./scripts/ci-package.sh

          echo
          echo "Build completed."

      # ============================================================
      # Verify output
      # ============================================================

      - name: Verify release output
        shell: cpa.sh {0} --environment-variables VERSION TARGET_GOOS TARGET_GOARCH DIST_DIR
        env:
          VERSION: ${{ needs.version.outputs.value }}
          TARGET_GOOS: freebsd
          TARGET_GOARCH: amd64
          DIST_DIR: dist
        run: |
          set -euo pipefail

          archive="${DIST_DIR}/deepseek-vision_${VERSION}_${TARGET_GOOS}_${TARGET_GOARCH}.zip"
          checksums="${DIST_DIR}/checksums.txt"

          echo "========================================"
          echo "Release Output"
          echo "========================================"

          echo
          echo "Expected archive:"
          echo "$archive"

          if [[ ! -f "$archive" ]]; then
            echo "ERROR: release archive not found" >&2

            echo
            echo "Available files:"
            find "$DIST_DIR" -maxdepth 2 -type f -print >&2 || true

            exit 1
          fi

          if [[ ! -s "$archive" ]]; then
            echo "ERROR: release archive is empty" >&2
            exit 1
          fi

          if [[ ! -f "$checksums" ]]; then
            echo "ERROR: checksums.txt not found" >&2
            exit 1
          fi

          echo
          echo "Archive:"
          ls -lh "$archive"

          echo
          echo "Archive contents:"
          unzip -l "$archive"

          echo
          echo "Checksum:"
          cat "$checksums"

          echo
          echo "Verifying SHA256..."

          python3 - "$archive" "$checksums" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          checksums = Path(sys.argv[2])

          actual = hashlib.sha256(archive.read_bytes()).hexdigest()

          expected = ""

          for line in checksums.read_text(
              encoding="ascii"
          ).splitlines():
              parts = line.split(maxsplit=1)

              if len(parts) == 2 and parts[1] == archive.name:
                  expected = parts[0]
                  break

          if not expected:
              raise SystemExit(
                  f"no checksum entry found for {archive.name}"
              )

          if expected != actual:
              raise SystemExit(
                  "checksum mismatch:\n"
                  f"expected: {expected}\n"
                  f"actual:   {actual}"
              )

          print(f"SHA256 verified: {actual}")
          PY

          echo
          echo "Release output verified successfully."

      # ============================================================
      # Upload GitHub artifact
      # ============================================================

      - name: Upload FreeBSD artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-freebsd-amd64
          path: |
            dist/deepseek-vision_${{ needs.version.outputs.value }}_freebsd_amd64.zip
            dist/checksums.txt
          if-no-files-found: error

  # ================================================================
  # Publish
  # ================================================================

  publish:
    name: Update draft release
    needs:
      - version
      - package

    runs-on: ubuntu-24.04

    steps:
      - name: Download FreeBSD artifact
        uses: actions/download-artifact@v4
        with:
          name: release-freebsd-amd64
          path: dist

      - name: Verify downloaded artifact
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail

          archive="dist/deepseek-vision_${VERSION}_freebsd_amd64.zip"
          checksums="dist/checksums.txt"

          echo "========================================"
          echo "Downloaded artifacts"
          echo "========================================"

          find dist -maxdepth 2 -type f -print

          test -f "$archive"
          test -s "$archive"

          test -f "$checksums"
          test -s "$checksums"

          echo
          echo "Archive:"
          ls -lh "$archive"

          echo
          echo "Checksum:"
          cat "$checksums"

      - name: Generate final checksum
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          set -euo pipefail

          archive="dist/deepseek-vision_${VERSION}_freebsd_amd64.zip"

          sha256sum "$archive" > dist/checksums.txt

          echo "Final checksum:"
          cat dist/checksums.txt

      - name: Upload assets to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            dist/deepseek-vision_${{ needs.version.outputs.value }}_freebsd_amd64.zip
            dist/checksums.txt
