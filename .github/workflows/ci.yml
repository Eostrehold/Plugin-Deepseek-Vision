name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Contract fixtures
        run: ./scripts/verify-contracts.sh

  package:
    name: Linux amd64 package
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify package
        shell: bash
        env:
          GO_VERSION: "1.26.4"
          TARGET_GOOS: linux
          TARGET_GOARCH: amd64
          DIST_DIR: dist
        run: ./scripts/ci-package.sh
      - name: Upload package smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-vision-linux-amd64
          path: dist/*
          if-no-files-found: error
